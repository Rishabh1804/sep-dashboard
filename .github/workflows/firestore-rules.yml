# Firestore security-rules CI — ISOLATED from the main `test` gate.
#
# This is a separate workflow (separate job, separate deps) so it can never
# break the existing green build. It needs a JVM (the Firestore emulator is a
# Java process) + firebase-tools, which the main CI deliberately does not carry.
# The rule-test harness lives in tests/rules/ as its own npm package and is
# NOT installed by the root pnpm workspace.
#
# Path-filtered: only runs when the rules file, emulator config, the harness,
# or this workflow change — no cost on unrelated PRs.

name: Firestore Rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/reference/FIRESTORE_RULES.ref.txt'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [main]
    paths:
      - 'docs/reference/FIRESTORE_RULES.ref.txt'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/firestore-rules.yml'

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (Firestore emulator runs on a JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rule-test harness deps
        working-directory: tests/rules
        run: npm install

      - name: Run rules tests against the Firestore emulator
        run: >
          firebase emulators:exec --only firestore --project demo-sep
          "npm --prefix tests/rules run test:rules"
