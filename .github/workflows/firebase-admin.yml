# Manually-triggered Firebase admin operations against staging.
#
# Consumes the FIREBASE_SERVICE_ACCOUNT_STAGING repository secret
# (Settings → Secrets and variables → Actions). The key never appears in
# the repo, in cloud-session env vars, or in logs — scripts/deploy-rules.mjs
# materializes it to a 0600 temp file only for the duration of the command.
#
# Actions:
#   deploy-rules     — push docs/reference/FIRESTORE_RULES.ref.txt live
#   deploy-functions — deploy Cloud Functions (Stage E aggregators); needs extra
#                      IAM on the SA — see scripts/deploy-functions.mjs header
#   mint-token   — provision a worker + print the handler sign-in URL
#                  (custom token, 1h validity; REFUSES on public repos — see guard)
#   seed-dry-run — transform + Zod-validate the FIXTURE export, no writes
#   seed-fixture — FULL seed of the synthetic fixture into staging (creates
#                  config/min_supported_build + sample customers/items/jobs;
#                  staging-only smoke data — the real 508-challan seed runs
#                  locally with the actual export file)

name: firebase-admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation'
        required: true
        type: choice
        options: [deploy-rules, deploy-functions, mint-token, seed-dry-run, seed-fixture, verify-e2e]
      uid:
        description: 'mint-token: worker uid (e.g. champai)'
        required: false
        type: string
      name:
        description: 'mint-token: display name'
        required: false
        type: string
      roles:
        description: 'mint-token: comma-separated roles'
        required: false
        default: 'handler'
        type: string
      admin:
        description: 'mint-token: grant is_admin claim'
        required: false
        default: false
        type: boolean

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
    steps:
      # PUBLIC-REPO GUARD for mint-token, FIRST — before checkout/install:
      # it needs no dependencies, and failing here keeps a refused run at
      # ~2s instead of a minute of pnpm install with the staging credential
      # sitting in job env. mint-token prints a live sign-in token; public
      # run logs are world-readable. scripts/mint-token.mjs carries its own
      # CI refusal as the second line of defense (MINT_ALLOW_CI_LOGS).
      - name: Refuse mint-token on a public repo
        if: inputs.action == 'mint-token' && !github.event.repository.private
        run: |
          echo "::error::Refusing to print a live sign-in token into PUBLIC run logs."
          echo "Run locally instead: GOOGLE_APPLICATION_CREDENTIALS=<sa.json> pnpm mint:token -- --uid <id> [--admin]"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Firestore rules (staging)
        if: inputs.action == 'deploy-rules'
        run: pnpm deploy:rules:staging

      - name: Deploy Cloud Functions (staging)
        if: inputs.action == 'deploy-functions'
        run: pnpm deploy:functions:staging

      - name: Mint provisioning token
        if: inputs.action == 'mint-token'
        # Reaching this step means the first-step public-repo guard passed
        # (repo is private) — MINT_ALLOW_CI_LOGS=1 tells the script's own
        # CI refusal that log privacy was verified by the workflow.
        #
        # Inputs pass through env, never spliced into the command line —
        # ${{ }} interpolation in run: is shell injection in a job whose
        # env holds the staging admin credential.
        env:
          IN_UID: ${{ inputs.uid }}
          IN_NAME: ${{ inputs.name }}
          IN_ROLES: ${{ inputs.roles }}
          IN_ADMIN: ${{ inputs.admin }}
          MINT_ALLOW_CI_LOGS: '1'
        run: node scripts/mint-token.mjs --uid "$IN_UID" --name "${IN_NAME:-$IN_UID}" --roles "$IN_ROLES" $([ "$IN_ADMIN" = "true" ] && echo --admin)

      - name: Seed dry-run (fixture)
        if: inputs.action == 'seed-dry-run'
        run: node scripts/seed-staging.mjs --export tests/fixtures/invoicing-sample.json --dry-run

      - name: Seed fixture (full write to staging)
        if: inputs.action == 'seed-fixture'
        run: node scripts/seed-staging.mjs --export tests/fixtures/invoicing-sample.json

      - name: Verify e2e (self-mint → live transport write → read-back)
        if: inputs.action == 'verify-e2e'
        run: node scripts/verify-e2e-staging.mjs --self-mint
